workflows:
  android-native-build:
    name: CalcVerse Pro Stable Build FIXED
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17
      groups:
        - default

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Make gradlew executable
        script: |
          chmod +x gradlew

      - name: Setup local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 🔥 IMPORTANT FIX: disable custom signing for debug
      - name: Force debug signing fix
        script: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Clean project
        script: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

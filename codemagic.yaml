workflows:
  android-native-build:
    name: CalcVerse Pro Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17
      groups:
        - default

      vars:
        PACKAGE_NAME: "com.aistudio.calcversepro.whpdmq"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Fix permissions
        script: |
          chmod +x gradlew

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Clean project
        script: |
          ./gradlew clean --no-daemon

      - name: Run tests
        script: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - princearabdurrahman57@gmail.com
        notify:
          success: true
          failure: true

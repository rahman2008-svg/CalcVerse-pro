workflows:
  android-native-build:
    name: CalcVerse Pro Native Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - default
      vars:
        PACKAGE_NAME: "com.aistudio.calcversepro.whpdmq"
      java: 17

    scripts:
      - name: Set up local configurations
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - princearabdurrahman57@gmail.com
        notify:
          success: true
          failure: true

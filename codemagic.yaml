workflows:
  android-native-build:
    name: CalcVerse Pro - Native Build
    max_build_duration: 45
    instance_type: mac_mini_m1

    environment:
      java: 17
      groups:
        - keystore   # ← এখানে আপনার signing secrets গ্রুপ যোগ করুন
      vars:
        - ANDROID_SDK_ROOT

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Make gradlew executable
        script: chmod +x gradlew

      - name: Setup local.properties
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create Debug Keystore (if needed)
        script: |
          mkdir -p \~/.android
          keytool -genkey -v \
            -keystore \~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Clean
        script: ./gradlew clean --no-daemon

      - name: Build Debug APK
        script: ./gradlew assembleDebug --no-daemon --stacktrace

      # Release build শুধু তখন চালাবেন যখন সব signing ঠিক থাকবে
      # - name: Build Release AAB
      #   script: ./gradlew bundleRelease --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      # - app/build/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - your@email.com
